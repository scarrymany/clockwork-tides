plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '1.0.0'
group = 'dev.clockworktides'
base { archivesName = 'clockwork-tides' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
}
neoForge {
    version = '21.1.219'
    runs {
        client { client(); gameDirectory = file('run/client'); if (project.hasProperty('showcase')) systemProperty 'clockwork_tides.showcase', 'true' }
        server { server(); programArgument '--nogui'; gameDirectory = file('run/server') }
        gameTestServer { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', 'clockwork_tides'; gameDirectory = file('run/gametest') }
    }
    mods { clockwork_tides { sourceSet sourceSets.main } }
}
dependencies {
    implementation('com.simibubi.create:create-1.21.1:6.0.10-280:slim') { transitive = false }
    implementation('net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1')
    compileOnly('dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6')
    runtimeOnly('dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6')
    implementation('com.tterrag.registrate:Registrate:MC1.21-1.3.0+67')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
java { withSourcesJar() }
tasks.named('jar') { exclude 'dev/clockworktides/test/**'; exclude 'data/clockwork_tides/structure/empty.nbt' }

tasks.named("jar") { exclude "dev/clockworktides/qa/**" }
tasks.named('jar') { from('LICENSE') { into 'META-INF' } }
